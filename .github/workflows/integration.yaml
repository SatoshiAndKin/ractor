name: Ractor Cluster integration tests
on:
  push:
    branches:
      - main
    paths:
      - 'ractor_cluster*/**'
      - .github/workflows/integration.yaml
      - .github/workflows/integration-reviewed-linux.yaml
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'ractor_cluster*/**'
      - .github/workflows/integration.yaml
      - .github/workflows/integration-reviewed-linux.yaml

concurrency:
  group: pr-ci-integration.yaml-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: SatoshiAndKin/ractor/.github/workflows/integration-reviewed-linux.yaml@4e98574a4751a3ceb512ddc18a54e534b9a13acf
