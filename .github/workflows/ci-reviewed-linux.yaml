name: Reviewed Ractor Rust CI
on:
  workflow_call:

permissions:
  contents: read

# Reduce compiler memory without changing debug assertions or test selection.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  feature-checks:
    name: Stable Rust feature and target checks
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: SatoshiAndKin/ractor/.github/actions/setup-linux-rust@9c3c17b6acd68bedf821622846bd7f8cda6c1c54
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Check workspace defaults and all targets
        run: cargo check --workspace --all-targets

      - name: Check actor macros with native async traits
        run: cargo check --package ractor --features actor-macros --all-targets

      - name: Check async traits with Tokio
        run: cargo check --package ractor --features async-trait,actor-macros --all-targets

      - name: Check async traits with async-std
        run: cargo check --package ractor --no-default-features --features async-std,async-trait,actor-macros --all-targets

      - name: Check optional ractor APIs
        run: cargo check --package ractor --features cluster,monitors,blanket_serde,output-port-v2,actor-macros --all-targets

      - name: Check ractor_cluster with async traits
        run: cargo check --package ractor_cluster --features async-trait

      - name: Check the ractor WASM library
        run: cargo check --package ractor --lib --target wasm32-unknown-unknown

  test:
    name: ${{matrix.name}}
    runs-on:
      group: ski-ci-public-linux
      labels: ${{ matrix.runner || 'ski-kvm-public-pr' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Run the default tests
            package: ractor
            # flags:
          - name: Test ractor with async-trait
            package: ractor
            flags: -F async-trait
          - name: Test actor macros with native async traits
            package: ractor
            flags: -F actor-macros
          - name: Test actor macros with async-trait
            package: ractor
            flags: --no-default-features -F tokio_runtime,async-trait,actor-macros
          - name: Test actor macros with async-std and async-trait
            runner: ski-kvm-public-build
            package: ractor
            flags: --no-default-features -F async-std,async-trait,actor-macros
          - name: Test ractor without span propogation
            package: ractor
            flags: --no-default-features -F tokio_runtime
          - name: Test ractor with the `cluster` feature
            package: ractor
            flags: -F cluster
          - name: Test ractor with the `blanket_serde` feature
            package: ractor
            flags: -F blanket_serde
          - name: Test ractor with async-std runtime
            runner: ski-kvm-public-build
            package: ractor
            flags: --no-default-features -F async-std,message_span_propogation
          - name: Test ractor with async-std runtime but no span propagation
            runner: ski-kvm-public-build
            package: ractor
            flags: --no-default-features -F async-std
          - name: Test ractor with async-std runtime and async-trait
            runner: ski-kvm-public-build
            package: ractor
            flags: --no-default-features -F async-std,async-trait
          - name: Test ractor_cluster with native async traits
            package: ractor_cluster
            # flags:
          - name: Test ractor_cluster without message span propagation
            package: ractor_cluster
            flags: --no-default-features
            verify_no_span: true
          - name: Test ractor_cluster with async_trait
            package: ractor_cluster
            flags: -F async-trait
          - name: Test ractor with the monitor API
            package: ractor
            flags: -F monitors
          - name: Test ractor with output-port-v2 feature
            package: ractor
            flags: -F output-port-v2
          - name: Test ractor without output-port-v2 feature (explicit)
            package: ractor
            flags: --no-default-features -F tokio_runtime,message_span_propogation

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rust
        uses: SatoshiAndKin/ractor/.github/actions/setup-linux-rust@9c3c17b6acd68bedf821622846bd7f8cda6c1c54
        with:
          toolchain: stable

      - name: ${{matrix.name}}
        run: cargo test --package ${{matrix.package}} ${{matrix.flags}}

      - name: Verify message span propagation is disabled
        if: matrix.verify_no_span
        shell: bash
        run: |
          if cargo tree --package ractor_cluster --no-default-features --edges features --invert ractor \
            | grep -Fq 'ractor feature "message_span_propogation"'; then
            echo 'ractor/message_span_propogation was unexpectedly enabled' >&2
            exit 1
          fi

      - name: Test the default workspace
        if: matrix.name == 'Run the default tests'
        run: cargo test

  clippy:
    name: Clippy
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimal stable with clippy
        uses: SatoshiAndKin/ractor/.github/actions/setup-linux-rust@9c3c17b6acd68bedf821622846bd7f8cda6c1c54
        with:
          toolchain: stable
          components: clippy

      - name: Run Clippy
        run: cargo clippy --all -- -D clippy::all -D warnings

  rustfmt:
    name: rustfmt
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimal stable with rustfmt
        uses: SatoshiAndKin/ractor/.github/actions/setup-linux-rust@9c3c17b6acd68bedf821622846bd7f8cda6c1c54
        with:
          toolchain: stable
          components: rustfmt

      - name: Run rustfmt
        run: cargo fmt --all -- --check

  docs:
    name: docs
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimal stable with rustfmt
        uses: SatoshiAndKin/ractor/.github/actions/setup-linux-rust@9c3c17b6acd68bedf821622846bd7f8cda6c1c54
        with:
          toolchain: stable
          components: rustfmt

      - name: Run cargo doc on release profile
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps -r

  benches:
    name: benches
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rust
        uses: SatoshiAndKin/ractor/.github/actions/setup-linux-rust@9c3c17b6acd68bedf821622846bd7f8cda6c1c54
        with:
          toolchain: stable

      - name: Compile benchmarks
        run: cargo bench --no-run
