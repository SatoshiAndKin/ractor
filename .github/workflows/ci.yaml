name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-ci-ci.yaml-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: SatoshiAndKin/ractor/.github/workflows/ci-reviewed-linux.yaml@94969061aec45f869beb908f097c1ceab9f959ea
