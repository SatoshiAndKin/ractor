name: Code Coverage
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  coverage:
    name: Coverage using LLVM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.4

      - name: Run instrumented tests and export LCOV
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --package ractor --features actor-macros --test actor_macros
          cargo llvm-cov --no-report --workspace
          mkdir -p coverage
          cargo llvm-cov report --lcov --ignore-filename-regex '(^|/)xtask/' --output-path coverage/tests.lcov

      - name: Check whether Codecov is configured
        id: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the coverage report
        if: steps.codecov.outputs.configured != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ractor-coverage
          path: coverage/tests.lcov
          if-no-files-found: error

      - name: Upload to codecov.io
        if: steps.codecov.outputs.configured == 'true'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true # optional (default = false)
          files: coverage/tests.lcov
          token: ${{ secrets.CODECOV_TOKEN }} # required
          verbose: true # optional (default = false)
          name: ractor # optional
