name: Weekly upstream Renovate

on:
  schedule:
    - cron: "15 17 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: Open update pull requests
        type: boolean
        default: false

permissions: {}

concurrency:
  group: renovate-upstream

jobs:
  renovate:
    if: github.repository == 'SatoshiAndKin/ractor'
    permissions:
      contents: write
      issues: read
      pull-requests: write
    uses: SatoshiAndKin/ractor/.github/workflows/renovate-upstream-reviewed-linux.yml@bf352b5b15657c7b13a6da100399d277032d836d
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && !inputs.apply }}
