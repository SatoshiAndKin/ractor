name: Benchmark Comparison

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: bench-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  bench-base:
    name: Benchmark main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Restore historical base resolver entries
        run: |
          set -euo pipefail
          # Restore only historical resolver entries; keep the exact base source unchanged.
          # Cargo verifies the original published crate checksums. These WASM-only versions
          # are yanked, so a fresh resolution needs their existing lock entries.
          if [[ ! -f Cargo.lock ]] && grep -Fq 'tokio_with_wasm = { version = "0.10.1"' ractor/Cargo.toml; then
            cat > Cargo.lock <<'HISTORICAL_LOCK'
          version = 4

          [[package]]
          name = "tokio_with_wasm"
          version = "0.10.1"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "67952a4025dc561465d61ba68d4d0043b81d94c0ef61673164f00b90a7e6d97f"

          [[package]]
          name = "tokio_with_wasm_proc"
          version = "0.10.1"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "82fea9ff016ae35c66c3f49e9af0e5b334f489c761e64b02ed2d46d9520bda95"
          HISTORICAL_LOCK
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run benchmarks on main
        run: |
          cargo bench -p ractor \
            --bench actor \
            --bench async_traits \
            --bench factory \
            --bench simple_advanced_benchmarks \
            -- --save-baseline main
          if [ -f ractor_cluster/benches/message_serialization.rs ]; then
            cargo bench -p ractor_cluster \
              --bench message_serialization \
              -- --save-baseline main
          fi
        env:
          CI: 1

      - name: Install critcmp
        run: cargo install critcmp --locked

      - name: Export main baseline
        run: critcmp --export main > main.json

      - name: Upload main baseline
        uses: actions/upload-artifact@v7
        with:
          name: bench-baseline-main
          path: |
            main.json
            Cargo.lock
          if-no-files-found: error
          retention-days: 1

  bench-pr:
    name: Benchmark PR and compare
    runs-on: ubuntu-latest
    needs: bench-base
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Download main baseline
        uses: actions/download-artifact@v8
        with:
          name: bench-baseline-main

      - name: Run benchmarks on PR branch
        run: |
          cargo bench -p ractor \
            --bench actor \
            --bench async_traits \
            --bench factory \
            --bench simple_advanced_benchmarks \
            -- --save-baseline pr
          cargo bench -p ractor_cluster \
            --bench message_serialization \
            -- --save-baseline pr
        env:
          CI: 1

      - name: Install critcmp
        run: cargo install critcmp --locked

      - name: Compare benchmarks
        id: compare
        run: |
          # run the comparison twice: default multi-column output and a flattened
          # list view for easier per-benchmark deltas
          RESULT=$(critcmp main.json pr)
          LIST=$(critcmp main.json pr --list)
          echo "$RESULT"
          echo
          echo "Flat results (see per-benchmark deltas):"
          echo "$LIST"
          {
            echo "result<<EOF"
            echo "$RESULT"
            echo "EOF"
            echo "list<<EOF"
            echo "$LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Find existing benchmark comment
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Benchmark Comparison

      - name: Post or update benchmark comment
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## Benchmark Comparison (PR vs `main`)

            <details>
            <summary>Results (collapse to hide)</summary>

            ```
            ${{ steps.compare.outputs.result }}
            ```

            _Note: a **negative** delta indicates the PR is faster (an
            improvement); a **positive** delta means the PR is slower (a
            regression). Benchmarks are grouped (e.g., `small_messages`,
            `spawn_throughput`); the flattened list below shows every
            individual comparison for clearer deltas._

            _Benchmarks introduced by the current PR appear only in the `pr`
            column. Once merged, subsequent PRs will compare them against the
            `main` baseline normally._

            === per-benchmark breakdown ===

            ```
            ${{ steps.compare.outputs.list }}
            ```

            </details>

            _Benchmarks run on shared CI hardware (`ubuntu-latest`).
            Differences under ~5% may be noise._
