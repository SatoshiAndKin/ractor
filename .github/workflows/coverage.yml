name: Code Coverage
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-ci-coverage.yml-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage using xtask
    strategy:
      matrix:
        os: [ubuntu-latest]
        rust: [stable]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-llvm-cov@0.9.2

      - name: Test and record coverage
        run: |
          cargo llvm-cov --workspace --no-report
          cargo llvm-cov --no-report -p ractor --features actor-macros --test actor_macros
          mkdir -p coverage
          cargo llvm-cov report --lcov --output-path coverage/ractor.lcov
          test -s coverage/ractor.lcov

      - name: Upload the LCOV report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ractor-lcov
          path: coverage/ractor.lcov
          if-no-files-found: error

      - name: Upload to codecov.io
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: coverage/ractor.lcov
          token: ${{ env.CODECOV_TOKEN }}
          name: ractor
